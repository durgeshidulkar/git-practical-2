<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Little Question ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; overflow: hidden; font-family: "Trebuchet MS", Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f4, #ffe0e9);
      color: #30202a;
    }
    .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .heart { position: absolute; color: #f28aa4; opacity: .6; animation: float 6s ease-in-out infinite; }
    .heart:nth-child(1) { top: 12%; left: 10%; font-size: 30px; }
    .heart:nth-child(2) { top: 24%; right: 12%; font-size: 24px; animation-delay: 1s; }
    .heart:nth-child(3) { bottom: 18%; left: 15%; font-size: 36px; animation-delay: 2s; }
    .heart:nth-child(4) { bottom: 15%; right: 13%; font-size: 32px; animation-delay: 1.5s; }
    .heart:nth-child(5) { top: 55%; left: 5%; font-size: 20px; animation-delay: .5s; }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-16px) rotate(8deg); } }
    .card {
      width: min(100%, 560px); position: relative; text-align: center;
      padding: clamp(28px, 7vw, 52px) 22px; border-radius: 30px;
      background: rgba(255,255,255,.78); border: 1px solid rgba(255,255,255,.9);
      box-shadow: 0 18px 60px rgba(177, 66, 100, .14);
    }
    .top-heart { font-size: 48px; margin-bottom: 8px; animation: beat 1.2s infinite; }
    @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    h1 { font-size: clamp(2rem, 8vw, 3.3rem); line-height: 1.1; margin: 8px 0 14px; }
    .subtitle { color: #8b6876; font-size: 1.1rem; margin-bottom: 32px; }
    .buttons { display: flex; justify-content: center; align-items: center; gap: 18px; min-height: 70px; }
    button {
      border: 0; border-radius: 999px; padding: 15px 34px; min-width: 125px;
      font-size: 1.15rem; font-weight: 700; cursor: pointer; touch-action: manipulation;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    button:focus-visible { outline: 3px solid #6b3b54; outline-offset: 4px; }
    #yesBtn { color: white; background: #27b477; box-shadow: 0 7px 0 #16865a; }
    #yesBtn:hover { transform: translateY(-3px); box-shadow: 0 10px 0 #16865a; }
    #noBtn { color: #fff; background: #9c9299; box-shadow: 0 7px 0 #817780; }
    #noBtn.moving { position: fixed; z-index: 5; }
    #answer {
      display: none; margin: 34px auto 0; padding: 24px 18px; border-radius: 22px;
      background: #ffe4eb; animation: pop .35s ease both;
    }
    #answer.show { display: block; }
    #answer h2 { margin: 0 0 8px; font-size: clamp(1.6rem, 6vw, 2.2rem); }
    #answer p { margin: 0; color: #875568; }
    .footer { margin-top: 30px; color: #9c7a87; font-size: .95rem; }
    @keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
    @media (max-width: 390px) {
      .buttons { gap: 12px; }
      button { min-width: 110px; padding: 14px 24px; }
    }
  </style>
</head>
<body>
  <div class="hearts" aria-hidden="true">
    <span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span>
    <span class="heart">♥</span><span class="heart">♥</span>
  </div>
  <main class="card">
    <div class="top-heart" aria-hidden="true">💗</div>
    <h1>Do you like me?</h1>
    <div class="subtitle">Be honest... ❤️</div>
    <div class="buttons" id="buttonArea">
      <button id="yesBtn" type="button">Yes 💚</button>
      <button id="noBtn" type="button">No 🙈</button>
    </div>
    <section id="answer" aria-live="polite">
      <h2>I like you 2 ❤️😘</h2>
      <p>You just made me smile! 💕</p>
    </section>
    <div class="footer">You make my world brighter ♥</div>
  </main>
  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const answer = document.getElementById('answer');

    yesBtn.addEventListener('click', () => {
      answer.classList.add('show');
      yesBtn.textContent = 'Yes! 💖';
      noBtn.style.display = 'none';
    });

    function moveNoButton() {
      // Move the No button somewhere visible in the current screen.
      noBtn.classList.add('moving');
      const margin = 18;
      const maxX = Math.max(margin, window.innerWidth - noBtn.offsetWidth - margin);
      const maxY = Math.max(margin, window.innerHeight - noBtn.offsetHeight - margin);
      const x = margin + Math.random() * (maxX - margin);
      const y = margin + Math.random() * (maxY - margin);
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    }

    noBtn.addEventListener('pointerenter', moveNoButton);
    noBtn.addEventListener('click', moveNoButton);
    noBtn.addEventListener('touchstart', (event) => {
      event.preventDefault();
      moveNoButton();
    }, { passive: false });
  </script>
</body>
</html>
